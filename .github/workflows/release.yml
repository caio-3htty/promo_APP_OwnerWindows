name: owner-windows-release

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate required env
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "Missing VITE_SUPABASE_URL"
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ] && [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing VITE_SUPABASE_ANON_KEY or VITE_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint owner shell
        run: npm run lint

      - name: Build owner web shell
        run: npm run build

      - name: Build installer
        run: npm run desktop:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: promo_APP_OwnerWindows-installer
          path: release/*.exe
          if-no-files-found: error
